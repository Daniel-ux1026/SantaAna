<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Iniciar sesión | Panel Admin</title>
    <link rel="icon" href="/img/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body class="login-page">
    <main class="login-card">
        <div class="text-center mb-4">
            <img src="/img/logo.png" alt="" width="64" height="64" class="rounded-circle mb-3">
            <h1 class="h4">Panel Administrativo</h1>
            <p class="text-muted small mb-0">Iglesia del Nazareno Santa Ana</p>
        </div>

        <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required
                    autocomplete="username" autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required
                    autocomplete="current-password" minlength="10">
            </div>
            <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                <span class="btn-label">Iniciar sesión</span>
                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
        </form>

        <p class="text-center mt-4 mb-0">
            <a href="/" class="small text-muted"><i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al sitio
                público</a>
        </p>
    </main>

    <script src="/js/admin-login.js"></script>
</body>

</html>
